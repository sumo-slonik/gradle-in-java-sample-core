# Workflow CI: budowanie projektu Gradle i uruchamianie testów przy każdym pushu i Pull Requeście.
# Aby użyć go we własnym projekcie, skopiuj go do .github/workflows/ci.yml w głównym katalogu repozytorium.
name: CI

on:
  # push na dowolny branch (lab1, lab2, ...) - testy po każdym wypchniętym commicie
  push:
  # pull request (np. lab2 -> main) - wynik testów widoczny bezpośrednio w PR
  pull_request:
  # ręczne uruchomienie z zakładki Actions
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Katalog z projektem Gradle (tam, gdzie leżą settings.gradle(.kts) i gradlew).
        # W tym repozytorium projekt jest w głównym katalogu (obok settings.gradle.kts), więc: .
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Ta sama wersja Javy co w toolchainie w app/build.gradle.kts (JavaLanguageVersion.of(25)).
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # cache-provider: basic - otwartoźródłowy cache, działa również w repozytoriach prywatnych.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # "build" kompiluje kod i uruchamia testy jednostkowe (task "test").
      - name: Build and run tests
        run: ./gradlew build

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/test
